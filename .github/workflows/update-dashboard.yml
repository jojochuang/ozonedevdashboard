name: Update Ozone dev dashboard

on:
  push:
    branches: [main]
  schedule:
    # 09:00 UTC on the 1st of each month
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch PR velocity metrics
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/data
          python3 scripts/fetch_pr_velocity.py --input data/metrics.json -o site/data/metrics.json

      - name: Use committed metrics snapshot (push builds)
        if: github.event_name == 'push'
        run: |
          mkdir -p site/data
          cp data/metrics.json site/data/metrics.json

      - name: Assemble site
        run: |
          mkdir -p site/data site/assets
          cp index.html site/
          cp assets/style.css assets/app.js site/assets/
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit refreshed metrics snapshot
        if: github.event_name != 'push'
        run: |
          cp site/data/metrics.json data/metrics.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json
          git diff --staged --quiet || git commit -m "Refresh data/metrics.json from metrics workflow."
          git push
